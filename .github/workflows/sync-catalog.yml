name: Sync product catalog

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/sync_catalog.py"
      - ".github/workflows/sync-catalog.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install parser
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Download catalog and images
        run: python tools/sync_catalog.py
      - name: Commit local catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json assets/products
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync full product catalog and local images"
          git push
