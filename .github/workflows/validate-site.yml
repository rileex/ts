name: Validate storefront

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check catalog-runtime.js
      - name: Check catalog and local images
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("catalog.json").read_text(encoding="utf-8"))
          assert data["count"] == len(data["products"]) == 143
          photos = [photo for item in data["products"] for photo in item["photos"]]
          assert len(photos) >= 1700
          assert all(Path(path).is_file() for path in photos), "broken local image path"
          names = [item["name"].casefold() for item in data["products"]]
          assert not any("keune" in name or name == "кошик" or name == "лінійка емоції" for name in names)
          print(f"validated {len(data['products'])} products and {len(photos)} local images")
          PY
